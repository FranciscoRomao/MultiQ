[project]
name = "zac"
version = "0.1.0"
description = "ZAC compiler for zoned neutral atom architectures (vendored baseline)"
requires-python = ">=3.12"
license = {text = "BSD-3-Clause"}
dependencies = [
    "matplotlib>=3.10.1,<4.0.0",
    "numpy>=2.2.5,<3.0.0",
    "pandas>=2.2.3,<3.0.0",
    "qiskit>=2.0.0,<3.0.0",
    "rustworkx>=0.16.0,<0.17.0",
    "scipy>=1.15.2,<2.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["zac"]
