[project]
name = "pachinqo"
version = "0.1.0"
description = "PachinQo compiler for neutral atom architectures (vendored baseline)"
requires-python = ">=3.12"
dependencies = ["qiskit", "matplotlib"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["framework"]
