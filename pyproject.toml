[project]
name = "multiq"
version = "0.1.0"
description = "Default template for PDM package"
authors = []

dependencies = [
    "qiskit>=2.0.2",
    "matplotlib<4.0,>=3.0",
    "pylatexenc<3.0,>=2.0",
    "pandas==2.2.3",
    "networkx>=3.5",
    "mqt-bench>=1.1.9",
    "zac@git+https://github.com/danvonk/ZAC.git",
    "pyyaml>=6.0.2",
    "mqt-qcec>=3.0.0",
    "pachinqo @git+https://github.com/FranciscoRomao/PachinQo",
    "mqt-qmap==3.1.3",
    "seaborn>=0.13.2",
    "black>=25.1.0",
    "pyzx>=0.9.0",
]

requires-python = ">=3.12"
readme = "README.md"
license = {text = "MIT"}
keywords = ["quantum", "compilers"]

[build-system]
requires = ["pdm-backend"]
build-backend = "pdm.backend"

[tool.pdm]
distribution = true

[tool.black]
line-length = 120