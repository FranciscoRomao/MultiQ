[project]
name = "multiq"
version = "0.1.0"
description = "Compiler-runtime and verifier for multi-programming neutral atom quantum architectures"
readme = "README.md"
requires-python = ">=3.12"
license = {text = "MIT"}
keywords = ["quantum", "compilers", "neutral atoms"]
dependencies = [
    "qiskit>=2.0.2",
    "qiskit-qasm3-import>=0.6.0",
    "numpy>=2.2",
    "scipy>=1.15",
    "pandas==2.2.3",
    "matplotlib>=3.0,<4.0",
    "seaborn>=0.13.2",
    "networkx>=3.5",
    "pyyaml>=6.0.2",
    "tqdm>=4.67",
    "mqt-bench>=1.1.9",
    "mqt-qcec>=3.0.0",
    "mqt-qmap==3.8.0",
    "zac",
    "pachinqo",
]

[tool.uv.sources]
zac = { path = "compilers/zac" }
pachinqo = { path = "compilers/pachinqo" }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/multiq"]
